[package]
name = "threedbuilder"
version = "0.1.0"
description = "3D Builder desktop application"
authors = ["EC Creative Studios"]
edition = "2021"

[lib]
name = "threedbuilder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
